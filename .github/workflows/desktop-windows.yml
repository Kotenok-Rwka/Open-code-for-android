name: PocketCode Desktop — Windows EXE

on:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        working-directory: desktop
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name PocketCodeDesktop --add-data "pocketcode_desktop.py;." --add-data "ide_bridge.py;." pocketcode_desktop.py
      - name: Zip
        working-directory: desktop
        run: |
          Compress-Archive -Path dist\PocketCodeDesktop.exe, INSTALL.md -DestinationPath PocketCodeDesktop-windows-4.0.6-exe.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCodeDesktop-windows-4.0.6-exe
          path: desktop/PocketCodeDesktop-windows-4.0.6-exe.zip
