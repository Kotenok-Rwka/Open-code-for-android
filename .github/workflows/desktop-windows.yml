name: PocketCode Desktop — Windows EXE

on:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Версия ПК-пакета (как у APK)
        shell: pwsh
        run: |
          $ver = (& python desktop/version.py).Trim()
          "PC_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "::notice title=Версия ПК::$ver"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        working-directory: desktop
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name PocketCodeDesktop --add-data "pocketcode_desktop.py;." --add-data "version.py;." --add-data "ide_bridge.py;." pocketcode_app.py
      - name: Zip
        working-directory: desktop
        run: |
          Compress-Archive -Path dist\\PocketCodeDesktop.exe, INSTALL.md -DestinationPath "PocketCodeDesktop-$env:PC_VERSION-exe.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCodeDesktop-windows-${{ env.PC_VERSION }}-exe
          path: desktop/PocketCodeDesktop-*-exe.zip
