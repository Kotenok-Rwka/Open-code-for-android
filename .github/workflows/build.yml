name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Версия приложения (мажор.минор из version.properties, патч по коммитам)
        # Патч = число коммитов с последней правки version.properties + 1. Растёт сам, при смене VERSION_BASE начинается с 1.
        run: |
          BASE=$(sed -n 's/^VERSION_BASE=//p' version.properties | head -1 | tr -d '[:space:]')
          echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error title=Версия::в version.properties нет VERSION_BASE вида 4.0"; exit 1; }
          # Явный VERSION_PATCH в файле главнее счётчика коммитов (нужен, когда версию задают руками)
          FIXED=$(sed -n 's/^VERSION_PATCH=//p' version.properties | head -1 | tr -d '[:space:]')
          if echo "$FIXED" | grep -Eq '^[0-9]+$'; then
            PATCH="$FIXED"
          else
            FIRST=$(git log -1 --format=%H -- version.properties)
            PATCH=$(( $(git rev-list --count "$FIRST"..HEAD) + 1 ))
          fi
          echo "APP_VERSION=$BASE.$PATCH" >> "$GITHUB_ENV"
          echo "PC_PATCH=$PATCH" >> "$GITHUB_ENV"
          echo "::notice title=Версия::$BASE.$PATCH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Подпись своим ключом (если заданы секреты)
        env:
          KS: ${{ secrets.PC_KEYSTORE_B64 }}
          SP: ${{ secrets.PC_STORE_PASS }}
          KA: ${{ secrets.PC_KEY_ALIAS }}
          KP: ${{ secrets.PC_KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "PC_STORE_PASS=$SP" >> "$GITHUB_ENV"
            echo "PC_KEY_ALIAS=$KA" >> "$GITHUB_ENV"
            echo "PC_KEY_PASS=$KP" >> "$GITHUB_ENV"
            echo "Подписываю своим ключом"
            if keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" -alias "$KA" > "$RUNNER_TEMP/ks.txt" 2>&1; then
              echo "::notice title=Ключ подписи::OK $(grep -o 'SHA-256.*' "$RUNNER_TEMP/ks.txt" | head -1)"
            else
              echo "::error title=Ключ подписи::не открывается, проверь секреты. $(head -c 200 "$RUNNER_TEMP/ks.txt" | tr '\n' ' ')"; exit 1
            fi
          else
            echo "Секретов нет: общий debug-ключ"
          fi

      - name: ffmpeg для проверки команд видео
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Встроить Alpine Linux в APK
        # Linux ставится из самого приложения, без скачивания при установке. Архив проверяется по контрольной сумме с сайта Alpine.
        run: |
          set -e
          V=3.20.3
          mkdir -p app/src/main/assets/linux
          for A in aarch64 armv7; do
            U="https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/$A/alpine-minirootfs-$V-$A.tar.gz"
            F="app/src/main/assets/linux/alpine-$A.tar.gz"
            curl -fsSL --retry 3 -o "$F" "$U"
            SUM=$(curl -fsSL --retry 3 "$U.sha256" | awk '{print $1}')
            echo "$SUM  $F" | sha256sum -c -
          done
          ls -l app/src/main/assets/linux

      - name: Unit-тесты
        env:
          # В CI тесты с настоящим ffmpeg обязаны запускаться, а не молча пропускаться
          REQUIRE_FFMPEG: "1"
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Подпись готового APK
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$AS" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-256" | head -1 | sed 's/^/::notice title=Подпись APK::/'

      - name: Show build errors
        if: failure()
        run: |
          msg=$(cat test.log build.log 2>/dev/null | grep -E "^e: |What went wrong|Caused by|error:|Could not|FAILURE|FAILED" -A4 | head -80 | cut -c1-400)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketCode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release with APK
        # коммит с пометкой [без релиза] в тексте собирается и проверяется, но релиз не публикует
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[без релиза]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk PocketCode.apk
          # Что изменилось с прошлой сборки: темы коммитов между прошлым релизом и этим
          PREV=$(gh release list --limit 1 --json tagName -q '.[0].tagName // ""')
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="$PREV..HEAD"; FROM="с $PREV"
          else
            RANGE="-1"; FROM="(первая сборка в списке)"
          fi
          NOTES=$(git log $RANGE --no-merges --pretty='• %s' | grep -v -i -E 'ci:|\[skip' | head -40 | cut -c1-300)
          [ -z "$NOTES" ] && NOTES="• $(git log -1 --pretty=%s)"
          printf 'Что нового %s:\n%s\n' "$FROM" "$NOTES" > notes.txt
          TAG="v$APP_VERSION"
          # повторный запуск той же сборки: старый релиз с этим тегом заменяем
          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag -y; fi
          gh release create "$TAG" PocketCode.apk \
            --title "PocketCode $APP_VERSION" \
            --notes-file notes.txt \
            --target "${{ github.sha }}"
          # оставляем только 10 последних релизов
          gh release list --limit 100 --json tagName -q '.[10:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y
