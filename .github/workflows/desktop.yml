name: Desktop packages (Windows + Linux .deb)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, в который добавить файлы (например v4.0.11); пусто — только артефакты'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
      - name: Версия ПК-пакета (как у APK)
        run: |
          VER=$(python3 desktop/version.py)
          echo "PC_VERSION=$VER" >> "$GITHUB_ENV"
          echo "::notice title=Версия ПК::$VER"
      - name: Build Linux .deb
        run: bash desktop/build_linux_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/pocketcode-desktop_*.deb

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Версия ПК-пакета (как у APK)
        shell: pwsh
        run: |
          $ver = (& python desktop/version.py).Trim()
          "PC_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "::notice title=Версия ПК::$ver"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --name PocketCodeDesktop --paths desktop --hidden-import ide_bridge desktop/pocketcode_desktop.py
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force winout | Out-Null
          Copy-Item dist/PocketCodeDesktop.exe winout/
          Copy-Item desktop/INSTALL.md, desktop/EDITOR_INTEGRATION.md, desktop/README.md winout/
          Compress-Archive -Path winout/* -DestinationPath "PocketCodeDesktop-$env:PC_VERSION-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: PocketCodeDesktop-*-windows.zip

  publish:
    needs: [linux-deb, windows-exe]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          gh release upload "$TAG" out/pocketcode-desktop_*.deb out/PocketCodeDesktop-*-windows.zip --clobber
