# Версия приложения. Руками меняется только VERSION_BASE (мажор.минор): 4.0 -> 4.1 -> 5.0.
# Третье число (патч) считает CI само: сколько коммитов прошло с последнего изменения ЭТОГО файла, плюс 1.
# Поэтому при смене VERSION_BASE патч начинается заново с 1 (4.1.1, 5.0.1), а между сборками только растёт.
# Если нужен конкретный патч (например 4.5.3), добавь строку VERSION_PATCH=3 — она главнее счётчика.
# versionCode = мажор*1_000_000 + минор*1_000 + патч, так что он всегда растёт и обгоняет старые сборки 0.6.N.
# Не правь этот файл без смены версии: любая правка сбрасывает патч на 1.
VERSION_BASE=4.5
VERSION_PATCH=6
